<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Recipe777</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <style>
      body {
        margin: 0;
        background-color: #0b0c0e;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .login-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        max-width: 360px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      .login-box {
        width: 100%;
        background-color: #17191d;
        padding: 28px 24px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 8px;
        text-align: center;
      }
      p.subtitle {
        font-size: 0.85rem;
        color: #9ca3af;
        text-align: center;
        margin-bottom: 24px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
      }
      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #d1d5db;
      }
      input[type="password"] {
        background-color: #0b0c0e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 14px 16px;
        color: #ffffff;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
      }
      input[type="password"]:focus {
        border-color: #0fb8cc;
      }
      .submit-btn {
        width: 100%;
        background-color: #0fb8cc;
        color: #07252b;
        border: none;
        padding: 14px;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error-msg {
        color: #ef4444;
        font-size: 0.85rem;
        margin-top: 14px;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="login-container">
      <div class="login-box">
        <h1>Admin Zugang</h1>
        <p class="subtitle">Recipe777 Verwaltung</p>

        <form id="login-form">
          <div class="form-group">
            <label for="password">Passwort</label>
            <input
              type="password"
              id="password"
              required
              placeholder="Admin-Passwort..."
            />
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            Anmelden
          </button>
          <div class="error-msg" id="error-msg"></div>
        </form>
      </div>
    </main>

    <div id="navbar-container"></div>
    <script src="../js/navbar.js"></script>

    <script>
      const loginForm = document.getElementById("login-form");
      const passwordInput = document.getElementById("password");
      const errorMsg = document.getElementById("error-msg");
      const submitBtn = document.getElementById("submit-btn");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Prüfe...";

        try {
          const res = await fetch("http://localhost:3000/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value }),
          });

          const data = await res.json();

          if (res.ok && data.token) {
            localStorage.setItem("adminToken", data.token);
            // Weiterleitung direkt auf admin.html
            window.location.href = "admin.html";
          } else {
            errorMsg.textContent = data.error || "Ungültiges Passwort";
            errorMsg.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "Anmelden";
          }
        } catch (err) {
          errorMsg.textContent = "Backend nicht erreichbar.";
          errorMsg.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Anmelden";
        }
      });
    </script>
  </body>
</html>
