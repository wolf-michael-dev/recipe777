<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Recipe777</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body {
        margin: 0;
        background-color: #0b0c0e;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        background: #17191d;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      .login-box h2 {
        margin-top: 0;
        margin-bottom: 24px;
      }
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        margin-bottom: 16px;
        background: #0b0c0e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        border-radius: 14px;
        font-size: 1rem;
        outline: none;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #0fb8cc;
        color: #0b0c0e;
        border: none;
        font-weight: bold;
        font-size: 1rem;
        border-radius: 14px;
        cursor: pointer;
      }
      #msg {
        color: #ef4444;
        font-size: 0.9rem;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Recipe777 Admin</h2>
      <form id="login-form">
        <input type="password" id="admin-pass" placeholder="Admin Passwort..." required />
        <button type="submit">Einloggen</button>
      </form>
      <p id="msg"></p>
    </div>

    <script>
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("admin-pass").value;
        const msg = document.getElementById("msg");
        msg.textContent = "";

        try {
          const res = await fetch("http://localhost:3000/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
          });

          const data = await res.json();
          if (res.ok) {
            localStorage.setItem("adminToken", data.token);
            window.location.href = "add-recipe.html";
          } else {
            msg.textContent = data.error || "Login fehlgeschlagen";
          }
        } catch (err) {
          msg.textContent = "Verbindungsfehler zum Backend";
        }
      });
    </script>
  </body>
</html>
