<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe777 - Rezept Details</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/recipe-detail.css" />
</head>
  <body>
    <!-- 1. Header mit Hero-Bild & Navigation -->
    <header class="detail-header">
      <img src="" alt="Rezept Bild" id="detail-img" class="header-bg-img" />

      <div class="top-nav-overlay">
        <button class="nav-btn" onclick="history.back()">❮</button>
        <div class="nav-actions">
          <button class="nav-btn" type="button" aria-label="Favorit">❤️</button>
          <button class="nav-btn" type="button" aria-label="Teilen">🔗</button>
        </div>
      </div>
    </header>

    <!-- 2. Hauptinhalt -->
    <main class="detail-content">
      <h1 class="detail-title" id="detail-title">Lade Rezept...</h1>

      <div class="detail-badges">
        <span class="badge-pill">⏱ <span id="detail-time">-</span></span>
        <span class="badge-pill">👤 <span id="detail-portions">-</span></span>
      </div>

      <!-- 3. Zutatenliste -->
      <section class="ingredients-section">
        <h2 class="section-title">Zutaten</h2>
        <div class="ingredients-grid" id="detail-ingredients"></div>
      </section>

      <!-- 4. Zubereitungsschritte -->
      <section class="instructions-section">
        <h2 class="section-title">Zubereitung</h2>
        <div class="instructions-list" id="detail-instructions"></div>
      </section>
    </main>

    <!-- 5. Navigationsleiste -->
    <div id="navbar-container"></div>
    <script src="../js/navbar.js"></script>
    <script src="../js/recipe-detail.js"></script>
  </body>
</html>
