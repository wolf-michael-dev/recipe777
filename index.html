<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe777</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
  </head>
  <body>
    <main>
      <h1>Recipe777</h1>

      <!-- Begrüßungskopf -->
      <header class="welcome-header">
        <p id="welcome-message"></p>
      </header>

      <!-- Highlight-Karussell (Dynamisches Swipe & Lazy Load) -->
      <section class="carousel-container" id="featured-carousel">
        <!-- Dieser unsichtbare Kasten löst das Nachladen aus, wenn er ins Bild scrollt -->
        <div
          id="carousel-observer-target"
          style="min-width: 1px; flex-shrink: 0"
        ></div>
      </section>

      <!-- Kategorien-Raster (komplett) -->
      <section class="categories-section">
        <h3 id="categories-title"></h3>
        <div class="categories-grid">
          <div class="category-card" tabindex="0" role="button">
            <span class="category-icon" style="color: #0fb8cc">🐟</span>
            <span class="category-name" id="cat-seafood"></span>
          </div>
          <div class="category-card" tabindex="0" role="button">
            <span class="category-icon" style="color: #39e03d">🥗</span>
            <span class="category-name" id="cat-salads"></span>
          </div>
          <div class="category-card" tabindex="0" role="button">
            <span class="category-icon" style="color: #ff007f">🧁</span>
            <span class="category-name" id="cat-baking"></span>
          </div>
          <div class="category-card" tabindex="0" role="button">
            <span class="category-icon" style="color: #ff9900">🍴</span>
            <span class="category-name" id="cat-mains"></span>
          </div>
        </div>
      </section>

      <!-- Gedanke des Tages -->
      <section class="thought-card">
        <h4 class="thought-header">📖 <span id="thought-heading"></span></h4>
        <p class="thought-quote" id="thought-quote"></p>
        <p class="thought-ref" id="thought-ref"></p>
      </section>
    </main>

    <!-- Container für die dynamisch geladene Navigationsleiste -->
    <div id="navbar-container"></div>

    <script src="js/navbar.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
